image {
    monitor =
    path = /home/victor/Image/Fondo/logo.png
    border_size = 2
    border_color = $primary_3_rgba 
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 25, 170
    halign = center
    valign = center
}
# NAME
label {
    monitor =
    text = $USER
    color = rgba(220, 220, 220, 1)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 25, 80
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(235, 235, 235, 1)
    font_size = 60
    font_family = SF Pro Display Bold
    position = 30, -20
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(180, 180, 180, 0.7)
    font_size = 19
    font_family = SF Pro Display Bold
    position = 35, -90
    halign = center
    valign = center
}

